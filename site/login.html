<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Place - تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #05070a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 420px; background: #0d1117; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h1 { font-size: 28px; font-weight: 700; color: #fff; }
        .logo h1 span { color: #818cf8; }
        .logo p { font-size: 13px; color: #94a3b8; margin-top: 5px; }

        .tabs { display: flex; background: #161b22; border-radius: 8px; padding: 4px; margin-bottom: 25px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: #94a3b8; border-radius: 6px; transition: 0.3s; }
        .tab.active { background: #6366f1; color: #fff; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #161b22; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 15px; }
        input:focus { outline: none; border-color: #818cf8; }

        .btn-submit { width: 100%; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #4f46e5; }

        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>One <span>Place</span></h1>
            <p>منصة خدمات طلاب الجامعات الخاصة</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
            <div class="tab" onclick="switchTab('signup')">حساب جديد</div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" class="form-section active" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>البريد الجامعي</label>
                <input type="email" placeholder="student@must.edu.eg" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">دخول للمنصة</button>
        </form>

        <!-- نموذج إنشاء حساب -->
        <form id="signup-form" class="form-section" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="اسمك الثلاثي" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني الجامعي</label>
                <input type="email" placeholder="student@must.edu.eg" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">إنشاء الحساب</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-section');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            // الانتقال للصفحة الرئيسية بعد تسجيل الدخول أو إنشاء الحساب بنجاح
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
