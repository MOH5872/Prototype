<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Place - المنصة الطلابية الموحدة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #05070a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden;
            padding: 20px;
        }
        
        .slide-container { 
            position: relative; 
            width: 1150px; 
            max-width: 100%;
            background: #0d1117; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 50px 60px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            gap: 40px;
        }

        .glow { 
            position: absolute; 
            top: -100px; 
            right: -100px; 
            width: 450px; 
            height: 450px; 
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(13, 17, 23, 0) 70%); 
            border-radius: 50%; 
            pointer-events: none; 
            z-index: 1;
        }

        .hero-text { 
            position: relative;
            z-index: 2;
            flex: 1;
        }
        .badge { 
            display: inline-block; 
            background-color: rgba(99, 102, 241, 0.1); 
            color: #818cf8; 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            padding: 6px 18px; 
            border-radius: 30px; 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }
        h1 { 
            font-size: 56px; 
            font-weight: 700; 
            letter-spacing: -1px; 
            margin-bottom: 15px; 
        }
        h1 span { color: #818cf8; }
        p { 
            font-size: 17px; 
            color: #94a3b8; 
            line-height: 1.7; 
        }

        .auth-box {
            position: relative;
            z-index: 2;
            width: 380px;
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .tabs { 
            display: flex; 
            background: #0d1117; 
            border-radius: 8px; 
            padding: 4px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 600; 
            color: #94a3b8; 
            border-radius: 6px; 
            transition: 0.3s; 
        }
        .tab.active { background: #6366f1; color: #fff; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #94a3b8; }
        input { 
            width: 100%; 
            padding: 10px 12px; 
            background: #0d1117; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
        }
        input:focus { outline: none; border-color: #818cf8; }

        .btn-submit { 
            width: 100%; 
            background: #6366f1; 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            transition: background 0.2s; 
            margin-top: 5px; 
        }
        .btn-submit:hover { background: #4f46e5; }

        .form-section { display: none; }
        .form-section.active { display: block; }

        @media(max-width: 900px) {
            .slide-container { flex-direction: column; padding: 30px; }
            .hero-text { text-align: center; margin-bottom: 20px; }
            .auth-box { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="glow"></div>
        
        <div class="hero-text">
            <div class="badge">المنصة الطلابية الموحدة</div>
            <h1>One <span>Place</span></h1>
            <p>الوجهة الشاملة لكل طالب جامعي خاص. نجمع لك كل الخدمات الأكاديمية، المعيشية، المهنية، والترفيهية في منصة ذكية واحدة لتسهيل حياتك الجامعية.</p>
        </div>

        <div class="auth-box">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
                <div class="tab" onclick="switchTab('signup')">حساب جديد</div>
            </div>

            <form id="login-form" class="form-section active" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني الجامعي</label>
                    <input type="email" placeholder="student@university.edu.eg" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">دخول للمنصة</button>
            </form>

            <form id="signup-form" class="form-section" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" placeholder="اسمك الثلاثي" required>
                </div>
                <div class="form-group">
                    <label>البريد الجامعي</label>
                    <input type="email" placeholder="student@university.edu.eg" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">إنشاء الحساب</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-section');
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }
        function handleAuth(event) {
            event.preventDefault();
            window.location.href = 'services.html';
        }
    </script>
</body>
</html>
